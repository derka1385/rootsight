<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- iPhone "Add to Home Screen" opens full-screen like an app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f1411" />
    <title>Rootsight</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; height: 100%; }
      body { font: 15px/1.4 system-ui, -apple-system, sans-serif; background: #0a0d0b; color: #e6ede7; }
      button, input { font: inherit; font-size: 16px; } /* 16px: stops iOS zooming into inputs */
      /* Phone-shaped app. On a desktop it shows as a phone-sized frame, so the Mac preview matches the iPhone. */
      .app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; background: #0f1411; overflow: hidden; }
      @media (min-width: 600px) {
        .app { height: min(calc(100dvh - 32px), 932px); margin-top: 16px; border: 1px solid #253029; border-radius: 32px; }
      }
      .scroll { flex: 1; overflow-y: auto; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
      .tabbar { display: flex; border-top: 1px solid #253029; padding-bottom: env(safe-area-inset-bottom); }
      .tabbar button { flex: 1; padding: 12px 0; background: none; border: 0; color: inherit; opacity: 0.6; }
      .tabbar button[aria-current] { opacity: 1; font-weight: 600; }
      .card { display: block; width: 100%; text-align: left; padding: 12px; margin-bottom: 10px; border: 1px solid #253029; border-radius: 12px; background: #151c17; color: inherit; }
      .link { all: unset; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
